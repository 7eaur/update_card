name: Site CI

on:
  push:
    branches:
      - main
      - 'site/**'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'brand/**'
      - 'vercel.json'
      - '.github/workflows/site-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'brand/**'
      - 'vercel.json'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build static site
        run: npm run build

      - name: Verify routes and local references
        run: npm run check

      - name: Capture visual QA screenshots
        run: |
          mkdir -p qa/mobile qa/desktop
          python3 -m pip install --quiet pillow
          python3 -m http.server 4173 --directory dist >/tmp/update-card-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::Chrome is unavailable; visual screenshots skipped."
            exit 0
          fi

          routes=(
            "home|"
            "about|about/"
            "services|services/"
            "games|services/games/"
            "gift-cards|services/gift-cards/"
            "social-entertainment|services/social-entertainment/"
            "faq|faq/"
            "contact|contact/"
          )

          for entry in "${routes[@]}"; do
            name="${entry%%|*}"
            path="${entry#*|}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion=reduce               --window-size=390,6000               --screenshot="qa/mobile/${name}.png"               "http://127.0.0.1:4173/${path}"

            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion=reduce               --window-size=1440,5000               --screenshot="qa/desktop/${name}.png"               "http://127.0.0.1:4173/${path}"
          done

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          def crop_trailing_canvas(path: Path):
              image = Image.open(path).convert("RGB")
              # CI uses an intentionally tall viewport to capture the whole page.
              # Trim only the uniform trailing canvas below the document/footer.
              background = Image.new("RGB", image.size, image.getpixel((0, image.height - 1)))
              diff = ImageChops.difference(image, background)
              bbox = diff.getbbox()
              if not bbox:
                  return
              bottom = min(image.height, bbox[3] + 12)
              if bottom < image.height - 40:
                  image.crop((0, 0, image.width, bottom)).save(path)

          for folder in (Path("qa/mobile"), Path("qa/desktop")):
              for screenshot in folder.glob("*.png"):
                  crop_trailing_canvas(screenshot)
          PY

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: qa/
          if-no-files-found: warn

      - name: Enforce performance budgets
        run: |
          CSS_BYTES=$(wc -c < dist/assets/site.css)
          JS_BYTES=$(wc -c < dist/assets/site.js)
          HTML_BYTES=$(wc -c < dist/index.html)
          CORE_MEDIA_BYTES=$(find dist/assets/media dist/assets/images -type f ! -path '*/subservices/*' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          SUBSERVICE_MEDIA_BYTES=$(find dist/assets/media/subservices -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          LARGEST_MEDIA=$(find dist/assets/media dist/assets/images -type f -printf '%s %p\n' | sort -nr | head -1)

          echo "CSS: $CSS_BYTES bytes"
          echo "JS: $JS_BYTES bytes"
          echo "Home HTML: $HTML_BYTES bytes"
          echo "Core media total: $CORE_MEDIA_BYTES bytes"
          echo "Lazy subservice media total: $SUBSERVICE_MEDIA_BYTES bytes"
          echo "Largest content media: $LARGEST_MEDIA"

          test "$CSS_BYTES" -le 55000
          test "$JS_BYTES" -le 12000
          test "$HTML_BYTES" -le 40000
          test "$CORE_MEDIA_BYTES" -le 300000
          test "$SUBSERVICE_MEDIA_BYTES" -le 600000

          if find dist/assets/media dist/assets/images -type f -size +50000c | grep -q .; then
            echo "::error::A content image exceeds the 50 KB performance budget."
            find dist/assets/media dist/assets/images -type f -size +50000c -printf '%s %p\n'
            exit 1
          fi

      - name: Report production asset sizes
        run: |
          wc -c dist/assets/site.css dist/assets/site.js dist/index.html
          du -sh dist
          find dist -type f | wc -l
